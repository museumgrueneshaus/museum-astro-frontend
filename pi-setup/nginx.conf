server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    gzip on;
    gzip_types application/json text/html text/css application/javascript;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    root /var/www/museum;
    index index.html;

    # HTML files: short cache so updates are picked up quickly
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Astro build assets: content-addressed filenames, cache forever
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Local video files
    location /videos/ {
        alias /var/www/museum/videos/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000";
    }

    # Kiosk identity config
    location = /kiosk-config.json {
        alias /etc/museum-kiosk/kiosk-id.json;
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # ── Website-Proxy (für kiosk/website Template) ──────────────────────────
    # Proxied über localhost → X-Frame-Options wird entfernt → iframe funktioniert
    # URL wird in Sanity unter kioskTemplate.websiteSettings.url konfiguriert.
    # Wenn die externe Website z.B. https://www.museum-reutte.at ist,
    # lädt das iframe http://localhost/website-proxy/ statt der externen URL.
    location /website-proxy/ {
        # Ziel-URL wird beim Setup in /etc/museum-kiosk/website-proxy.conf gesetzt
        include /etc/museum-kiosk/website-proxy.conf;

        proxy_set_header  Host              $proxy_host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  Accept-Encoding   "";

        # Sicherheits-Header entfernen die das iframe blockieren würden
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;

        # URLs in HTML/CSS/JS auf den Proxy umschreiben
        # Damit bleiben alle Links innerhalb des Proxys
        proxy_set_header  Accept-Encoding   "";
        sub_filter_once   off;
        sub_filter_types  text/html text/css application/javascript application/json;
        # Ziel-Domain in allen Text-Antworten ersetzen
        # (wird beim Setup automatisch durch sync-content.sh gesetzt)
        include /etc/museum-kiosk/website-subfilter.conf;

        proxy_ssl_server_name on;
        proxy_redirect    default;
    }

    # SPA fallback: try the file, then fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
